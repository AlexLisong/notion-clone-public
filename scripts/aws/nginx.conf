server {
    listen 80;
    server_name folio.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/folio-acme; }
    location / { return 301 https://folio.example.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name folio.example.com;
    ssl_certificate /etc/letsencrypt/live/folio.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/folio.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 10m;
    # Native session authentication protects all team API routes.
    # Keep this denial even if an older binary is accidentally started.
    location = /api/workspace { return 403; }
    location ^~ /api/workspace/ { return 403; }
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "private, no-store" always;
    location / {
        proxy_pass http://127.0.0.1:4320;
        proxy_http_version 1.1;
        proxy_set_header Host folio.example.com;
        proxy_set_header X-Forwarded-Host folio.example.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        include /etc/folio/proxy-key.conf;
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
